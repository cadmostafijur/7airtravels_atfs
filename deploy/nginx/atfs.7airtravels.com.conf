# ATFS — atfs.7airtravels.com
# Shares the VPS with the main 7airtravels.com site (which owns :3000).
#   /           -> atfs-web    127.0.0.1:3010
#   /socket.io  -> atfs-worker 127.0.0.1:3011  (live attendance feed)
#
# Install:
#   cp deploy/nginx/atfs.7airtravels.com.conf /etc/nginx/sites-available/atfs
#   ln -s /etc/nginx/sites-available/atfs /etc/nginx/sites-enabled/atfs
#   certbot --nginx -d atfs.7airtravels.com     # adds the ssl_* lines + :80 redirect

server {
    listen 80;
    listen [::]:80;
    server_name atfs.7airtravels.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name atfs.7airtravels.com;

    ssl_certificate     /etc/letsencrypt/live/atfs.7airtravels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atfs.7airtravels.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Attendance exports (Excel/PDF) exceed the 1M default
    client_max_body_size 20M;

    # Live attendance feed from the sync worker. Must come before location /
    # so the WebSocket upgrade is not swallowed by the Next.js proxy.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.IO polls; keep the connection open well past the 60s default.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Device reads cross the VPN and can be slow.
        proxy_read_timeout 180s;
    }

    # Worker health, for uptime monitoring. Not exposed publicly by default —
    # uncomment and restrict if you point an external monitor at it.
    # location = /worker-health {
    #     proxy_pass http://127.0.0.1:3011/health/devices;
    #     allow 1.2.3.4;   # your monitoring source
    #     deny all;
    # }
}
